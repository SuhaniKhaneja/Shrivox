name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: test_dummy_key   # tests mock all external calls
      JWT_SECRET: ci_test_secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (correctness rules only)
        run: pip install ruff && ruff check --isolated --select E9,F app scripts tests

      - name: Guardrail regression eval (offline, no API key)
        # Prints precision/recall on the labelled set; tests/test_guardrails.py fails on any regression.
        run: python -m app.evaluation.guardrail_eval

      - name: Run unit tests
        # Integration tests (tests/integration) are skipped here; they run in the
        # `integration` job below against real PostgreSQL + Redis.
        run: |
          pip install coverage
          coverage run -m pytest tests/ -v
          coverage report --include='app/*' --fail-under=80

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t shrivox-ai:ci .

  integration:
    # Real PostgreSQL (pgvector) and Redis. Verifies tenant isolation where the
    # data lives -- SQL filters, pgvector search, Redis keys -- which the mocked
    # unit suite cannot. Gemini is the only thing faked.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shrivox
          POSTGRES_PASSWORD: shrivox
          POSTGRES_DB: shrivox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shrivox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOOGLE_API_KEY: test_dummy_key   # Gemini is faked; no network calls
      JWT_SECRET: ci_test_secret
      POSTGRES_DSN: postgresql+asyncpg://shrivox:shrivox@localhost:5432/shrivox_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: python -m pytest tests/integration --run-integration -v
